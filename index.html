{p:"ct",c:"Pricing",t:"Optional add-ons (Quick Gold and Quick Silver only)",tags:"wired panic remote immobilization immobiliser fuel protector add on",
 text:"No extra commission is paid on add-ons. Use them only to help close a sale if the client wants or asks about them.\n• **Wired Panic, R21 per month:** driver sends a distress signal to the control room. Must be requested by email to Admin for activation.\n• **Remote Immobilization, R46 per month:** the client uses the app to stop the car being started (start prevent). It doesn't affect a moving car or one already on. The client enters the code from the app to switch it off again.\n• **Hardwire Fuel, R36 per month:** fuel sensors give fuel level and consumption data. Calibration after the 3rd fill-up with 3 fuel slips sent to the fleet department.\n• **Protector, R75 per month:** roadside, legal and medical assistance via client services."},
{p:"ct",c:"Pricing",t:"Vision cameras",tags:"vision camera road dual footage data ignition",
 text:"Vision 1 (Road Vision): road-facing, 128GB, about 14 days of footage, R189. Vision 2 (Dual Vision): road and cabin facing, about 7 days of footage, R289. You must offer both and let the client choose.\n• Not a spy camera and not CCTV. **The camera does not stay on after the ignition is turned off.** It is visible on the windscreen and is used to prove what happened for insurance.\n• Live streaming and platform data are limited to 2GB. The client must buy more if used up, and needs their own data or WiFi for the app.\n• Can be sold alone or fitted to cars with other trackers. Replacement cost: Vision 1 R725, Vision 2 R1 160."},
{p:"ct",c:"QA",t:"What QA checks on the verification call",tags:"qa score card verification script behaviour slang name tone",
 text:"**Verification items:** agent name, calling from the brokerage, on behalf of Cartrack, package confirmed, 3 benefits mentioned, vehicle in full working order (clear YES), correct price, contract length and price increases, cancellation process and cost, DebiCheck explained, R19 fee, customer details recapped, business or personal account confirmed, VIN confirmed, declaration read with a clear YES for each point, pro-rata explained if needed, asked if the client has questions.\n**Behaviour items:** matched the client's tone and pace, active listening, verification in English then explained in the client's preferred language, used the client's name more than 3 times, **avoided slang**, let the client ask questions without interrupting, repeated a clause if interrupted, noted specific requests."},
{p:"ct",c:"Process",t:"After the sale: QA, submission and fitment",tags:"submit leads email debicheck error scheduling fitment dynamic branch",
 text:"1. Complete the sale and verification call. 2. Internal QA listens to the call and checks the sales sheet. 3. After approval, send the sales sheet and call recording to Cartrack leads (one email per client, subject: Broker Name / Broker Code / Client Surname / Client ID). 4. A voice logger captures the sale and you receive a username (e.g. CART00001), the client's account number.\n**If it fails:** a client in debt with Cartrack means a lost sale until they settle (send proof of payment and resubmit). Wrong ID or bank details: re-listen to the call and correct the sheet. An active unit from a previous owner needs the client's licence document and ID.\n**DebiCheck errors:** get a bank confirmation letter or proof of banking, or a screenshot of the Cartrack debit order from the client's banking app.\n**Fitment:** scheduling is dynamic. Technicians get one job at a time, stock can run out, and delays can happen. Tell clients scheduling may change. For missed appointments, send the reschedule request to the branch scheduling mailbox. If a client can't be reached by scheduling, you may do a three-way call to Cartrack scheduling and only facilitate the connection."},

/* ------------------------------- Netstar ------------------------------- */
{p:"ns",c:"Products",t:"Netstar product suite (November)",tags:"netstar early warning startag r239 r259 jam backup",
 text:"**Early Warning, R239 per month:** standard tracking unit.\n**Early Warning + StarTag, R259 per month:** adds a StarTag back-up tracker.\n**Both include:** stolen vehicle recovery, insurance fitment certificate, SARS logbook, tow-away alerts, early warning theft alerts, live tracking (app), battery disconnect alerts, panic button and auto-arm.\n**Why R259?** It adds a StarTag back-up: a second, wireless tracker that still finds the car if the main unit is jammed or removed."},
{p:"ns",c:"Products",t:"Early Warning and StarTag explained",tags:"tag keys arm disarm jamming resist car park panic startag battery three years mynetstar app",
 text:"**Early Warning:**\n• Comes with a **tag kept with the keys**. It arms and disarms the unit automatically. No tag present means a \"Theft\" signal is sent.\n• **Panic button** for hijacking situations.\n• **Jamming Resist** tells Netstar if the unit's signals are tampered with, including **Car Park Jamming Alerts** if remote locking is jammed. Remind the client to make sure the vehicle is locked.\n• Transmits driving behaviour: location, speed, harsh acceleration and harsh braking.\n• Trip reports, location and fitment certificates on my.netstar.co.za or the MyNetstar app.\n**StarTag (back-up):** gives a general area location on the app but **no trip information**. Battery lasts a **maximum of 3 years** and the unit **must be replaced after 3 years**. In case of theft or hijacking the client contacts Netstar."},
{p:"ns",c:"Terms",t:"Netstar rental terms, banking and fitment",tags:"36 months settlement fee cancel 20 working days recovery not guaranteed banking debit salary date pro rata fitment monday friday customer support help me",
 text:"• **36 month rental contract.** Cancel for any reason on **20 working days written notice** and payment of a **reasonable settlement fee**.\n• **Recovery is not guaranteed**, but every reasonable effort is made.\n• The client should download the MyNetstar app to check the unit, or call Netstar every 6 months to test it.\n• **Netstar Customer Support Centre: 0860 12 24 36**, or directly from the app.\n• Full terms are on the Netstar website and a link is mailed. By having the unit installed the client agrees to them, and the call forms the basis of the contract.\n• **Banking:** if the account isn't the client's own, written authority from the account holder is needed. Debit orders run on the client's salary date. The first debit is higher: it includes the monthly premium plus a pro rata amount for the rest of the month. An email follows with the first invoice and a pro rata invoice from the installation date.\n• **Fitment:** Monday to Friday, 8am to 5pm. Needs a safe, private area, a vehicle in working condition, and enough space and light if in a basement. Booked with the booking tool (two slot options). A scheduler contacts the client if needed.\n• **After the sale:** the client gets access to Help Me, and a Help Me agent contacts them in the next few days."},
];

function renderFacts(){
  const tabs=[["price","Price List"],["ra","Repair Assist"],["ct","Cartrack"],["ns","Netstar"],["all","Search all"]];
  $app.innerHTML = `
  <h1>Info Centre</h1>
  <p class="lead">Prices, product knowledge and campaign rules in one place. Search for a word or pick a product.</p>
  <div class="tools"><div class="search"><input id="infoSearch" type="search" placeholder="Search, e.g. waiting period, DebiCheck, jammer, R870" value="${esc(state.infoQ)}" aria-label="Search the Info Centre"></div>
  <div class="filters" id="infoTabs"></div></div>
  <div id="infoBody"></div>
  <div class="note agent"><b class="tag">Agent</b><div>Internal training information for Innovate agents. Do not share outside Innovate. If something here doesn't match what you were told by your team leader, ask before you quote it.</div></div>`;
  paintInfoTabs(); paintInfo();
}
function paintInfoTabs(){
  const tabs=[["price","Price List"],["ra","Repair Assist"],["ct","Cartrack"],["ns","Netstar"],["all","All"]];
  document.getElementById("infoTabs").innerHTML = tabs.map(x=>`<button class="fchip ${state.infoTab===x[0]?"on":""}" data-infotab="${x[0]}">${x[1]}</button>`).join("");
}
function paintInfo(){
  const q=state.infoQ.trim().toLowerCase(); const el=document.getElementById("infoBody");
  if(!q && state.infoTab==="price"){ el.innerHTML=priceSuiteHtml(); return; }
  let list=INFO.filter(i=>(state.infoTab==="all"||state.infoTab==="price"||i.p===state.infoTab));
  if(q) list=list.filter(i=>{ const body=i.html? i.html().replace(/<[^>]+>/g," "):i.text; return (i.t+" "+i.c+" "+(i.tags||"")+" "+body).toLowerCase().includes(q); });
  if(!list.length){ el.innerHTML=`<div class="empty-state">No matches. Try another word or switch to All.</div>`; return; }
  const nm={ra:"Repair Assist",ct:"Cartrack",ns:"Netstar"};
  el.innerHTML = list.map(i=>`<details class="info"><summary><span>${esc(i.t)}</span><span class="badges"><span class="badge ${i.p}">${nm[i.p]}</span></span></summary><div class="info-body">${i.html? i.html() : `<p>${rich(i.text).replace(/(^|<br>)• /g,"$1&bull; ")}</p>`}</div></details>`).join("");
}

/* =====================================================================
   PAINT / SYNC HELPERS
===================================================================== */
function sizeFill(el){ if(el.classList.contains("fill")) el.style.width = (Math.max(el.value.length, (el.placeholder||"").length, 4)+2)+"ch"; }
function syncInputs(){
  document.querySelectorAll("[data-fill]").forEach(el=>{
    const v=state.fills[el.dataset.fill]; if(v!==undefined) el.value=v; sizeFill(el);
  });
}
function acc4(){ const d=(state.fills.acc||"").replace(/\D/g,""); return d.length>=4? d.slice(-4) : ""; }
function paintComputed(){
  document.querySelectorAll("[data-comp]").forEach(el=>{
    const k=el.dataset.comp; let v="", ph="";
    if(k==="plan"){ v = state.plan?PLANS[state.plan].name:""; ph="[Classic / Gold]"; }
    if(k==="price"){ v = state.plan?"R"+PLANS[state.plan].price:""; ph="R____"; }
    if(k==="acc4"){ v = acc4(); ph="[last 4 digits]"; }
    if(k==="nsname"){ v = state.nsplan? NSPLANS[state.nsplan].name:""; ph="[chosen package]"; }
    if(k==="nsprice"){ v = state.nsplan? "R"+NSPLANS[state.nsplan].price:""; ph="R____"; }
    el.textContent = v||ph; el.classList.toggle("empty",!v);
  });
}
function paintYN(k){
  const w=document.querySelector(`[data-yn="${k}"]`); if(!w) return;
  w.querySelectorAll("button").forEach(b=>b.classList.toggle("on",state.yn[k]===b.dataset.b));
  document.querySelectorAll(`[data-msg^="${k}-"]`).forEach(m=>m.hidden = m.dataset.msg!==`${k}-${state.yn[k]}`);
}
function paintPlan(){
  document.querySelectorAll(".plan[data-plan]").forEach(p=>p.classList.toggle("active",p.dataset.plan===state.plan));
  document.querySelectorAll(".plan[data-nsplan]").forEach(p=>p.classList.toggle("active",p.dataset.nsplan===state.nsplan));
  document.querySelectorAll("[data-plantbl]").forEach(t=>{ t.classList.toggle("sel-classic",state.plan==="classic"); t.classList.toggle("sel-gold",state.plan==="gold"); });
}
function paintAll(){
  document.querySelectorAll("[data-yn]").forEach(w=>paintYN(w.dataset.yn));
  paintPlan(); paintComputed();
}
function updateProgress(){
  return;
  const rq=REQS[state.product], done=rq.filter(isDone).length;
  const t=document.getElementById("progTxt"); if(t) t.textContent=`${done} of ${rq.length}`;
  const b=document.getElementById("progBar"); if(b) b.style.width=(rq.length? done/rq.length*100:0)+"%";
  document.querySelectorAll(".nav button").forEach(btn=>{
    const i=+btn.dataset.sec, items=rq.filter(r=>r.sec===i), left=items.filter(r=>!isDone(r)).length, bad=items.some(isBad);
    btn.classList.toggle("cur",i===state.sec);
    btn.classList.toggle("done", items.length>0 && left===0);
    btn.classList.toggle("flag", bad);
    const c=btn.querySelector(".cnt"); c.textContent = left? left+" to do":"";
    c.style.display = (items.length && left)? "":"none";
  });
  const here=rq.filter(r=>r.sec===state.sec), hl=here.filter(r=>!isDone(r)).length, hb=here.some(isBad);
  const pb=document.getElementById("pendBar");
  if(pb){
    if(hb){ pb.className="pendbar"; pb.style.background="var(--red-bg)"; pb.style.borderColor="#f2b8b5"; pb.style.color="#7c1a15"; pb.textContent="A client answer on this step was No. Read the red message above."; }
    else { pb.removeAttribute("style"); pb.className="pendbar"+(hl?"":" ok"); pb.textContent = here.length? (hl? `${hl} required confirmation${hl>1?"s":""} left on this step`:"All confirmations on this step are done") : "Nothing to tick on this step. Read it and move on."; }
  }
  refreshSummary();
}

document.addEventListener("input",e=>{
  const el=e.target.closest("[data-fill]"); if(!el) return;
  const k=el.dataset.fill, v=el.value; state.fills[k]=v;
  document.querySelectorAll(`[data-fill="${k}"]`).forEach(o=>{ if(o!==el) o.value=v; sizeFill(o); });
  sizeFill(el);
  if(k==="agent"){ try{ localStorage.setItem("innovate_agent",v); }catch(err){} }
  if(k==="acc") paintComputed();
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-tick]");
  if(t){ state.ticks[t.dataset.tick]=t.checked; updateProgress(); }
});

function copyText(txt,msg){
  const done=()=>toast(msg||"Copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallback()); } else fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Press Ctrl+C to copy"); } ta.remove(); }
}
function plain(s){ return s.replace(/\*\*/g,""); }

function goSec(i){ state.sec=i; const e=document.getElementById('sec-'+i); if(e){ const y=e.getBoundingClientRect().top+window.scrollY-130; window.scrollTo({top:y,behavior:'smooth'}); } }
function newCall(){
  if(state.product && !confirm("Start a new call? This clears everything typed and ticked for the current client.")) return;
  const agent=state.fills.agent; state.fills={}; if(agent) state.fills.agent=agent;
  state.yn={}; state.ticks={}; state.plan=null; state.sec=0;
  if(state.product){ renderCall(); window.scrollTo({top:0}); toast("New call started"); }
}

document.addEventListener("click",e=>{
  const t=e.target;
  let el;
  if((el=t.closest("[data-tab]"))){ state.fromCall=false; setTab(el.dataset.tab); return; }
  if((el=t.closest("[data-infogo]"))){ state.infoTab=el.dataset.infogo; state.infoQ=""; state.fromCall=false; setTab("facts"); return; }
  if((el=t.closest("[data-tab-go]"))){ setTab(el.dataset.tabGo); return; }
  if(!t.closest("button,input,a") && (el=t.closest(".pcard:not(.soon)"))){ const b=el.querySelector("[data-start]"); if(b){ b.click(); return; } }
  if((el=t.closest("[data-start]"))){
    const pid=el.dataset.start;
    state.product=pid; state.sec=0;
    state.tab="scripts"; setTab("scripts"); return;
  }
  if((el=t.closest("[data-sec]"))){ goSec(+el.dataset.sec); return; }
  if((el=t.closest("[data-goto]"))){ goSec(+el.dataset.goto); return; }
  if((el=t.closest("[data-b]"))){
    const k=el.closest("[data-yn]").dataset.yn, v=el.dataset.b;
    state.yn[k] = state.yn[k]===v ? undefined : v; if(state.yn[k]===undefined) delete state.yn[k];
    paintYN(k); updateProgress(); return;
  }
  if((el=t.closest("[data-nsplan]"))){ state.nsplan=el.dataset.nsplan; paintPlan(); paintComputed(); return; }
  if((el=t.closest("[data-plan]"))){ state.plan=el.dataset.plan; paintPlan(); paintComputed(); updateProgress(); return; }
  if((el=t.closest("[data-switch]"))){ state.product=el.dataset.switch; state.sec=0; renderCall(); window.scrollTo({top:0}); return; }
  if((el=t.closest("[data-infotab]"))){ state.infoTab=el.dataset.infotab; paintInfoTabs(); paintInfo(); return; }
  if((el=t.closest("[data-filter]"))){ state.filter=el.dataset.filter; paintFilters(); paintObjList(); return; }
  if((el=t.closest("[data-objgo]"))){ state.fromCall=true; state.openObj=el.dataset.objgo; state.filter="all"; state.query=""; state.tab="objections"; setTab("objections"); return; }
  if((el=t.closest("[data-copy]"))){ const o=OBJ.find(x=>x.id===el.dataset.copy); copyText(plain(o.say),"Answer copied"); e.preventDefault(); return; }
  if((el=t.closest("[data-act]"))){
    switch(el.dataset.act){
      case "home": state.fromCall=false; state.product=null; setTab("scripts"); break;
      case "newcall": newCall(); break;
      case "prev": if(state.sec>0) goSec(state.sec-1); break;
      case "next": if(state.sec<SCRIPTS[state.product].sections.length-1) goSec(state.sec+1); break;
      case "objections": state.fromCall=true; state.filter=state.product||"all"; state.query=""; setTab("objections"); break;
      case "backtocall": state.fromCall=false; setTab("scripts"); break;
      case "copysum": copyText(summaryText(),"Call summary copied"); break;
    }
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="objSearch"){ state.query=e.target.value; paintObjList(); }
  if(e.target.id==="infoSearch"){ state.infoQ=e.target.value; if(state.infoQ.trim() && state.infoTab==="price"){ state.infoTab="all"; paintInfoTabs(); } paintInfo(); }
});

/* ---------- Notepad (kept for this browser session only) ---------- */
(function(){
  const btn=document.getElementById("npBtn"), box=document.getElementById("np"), ta=document.getElementById("npText");
  try{ ta.value=sessionStorage.getItem("innovate_notes")||""; }catch(e){}
  const mark=()=>btn.classList.toggle("has",!!ta.value.trim());
  const open=o=>{ box.hidden=!o; btn.setAttribute("aria-expanded",o); if(o) ta.focus(); };
  btn.addEventListener("click",()=>open(box.hidden));
  document.getElementById("npClose").addEventListener("click",()=>open(false));
  ta.addEventListener("input",()=>{ try{ sessionStorage.setItem("innovate_notes",ta.value); }catch(e){} mark(); });
  document.getElementById("npCopy").addEventListener("click",()=>copyText(ta.value,"Notes copied"));
  document.getElementById("npClear").addEventListener("click",()=>{ ta.value=""; try{ sessionStorage.removeItem("innovate_notes"); }catch(e){} mark(); toast("Notes cleared"); });
  mark();
})();

render();
</script>
</body>
</html>
