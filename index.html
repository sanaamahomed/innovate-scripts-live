<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Innovate Script Assistant</title>
<style>
:root{
  --navy:#18305E; --navy-dark:#10224a; --yellow:#FFC709; --teal:#2CCCC4;
  --ink:#111111; --bg:#F5F7FA; --line:#E0E5EB; --white:#fff;
  --muted:#5b6678; --red:#B3261E; --red-bg:#FDECEA; --green:#16805A; --green-bg:#E5F6EE;
  --yellow-bg:#FFF7D6; --teal-bg:#E4F8F7;
  --radius:12px; --shadow:0 1px 2px rgba(16,34,74,.06),0 4px 14px rgba(16,34,74,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Header ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;border-bottom:4px solid var(--yellow)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0}
.brand svg{height:40px;width:auto;display:block}
.brand-title{font-weight:700;font-size:15px;letter-spacing:.3px;color:#fff;border-left:2px solid rgba(255,255,255,.3);padding-left:12px;line-height:1.2}
.brand-title small{display:block;font-weight:400;color:var(--yellow);font-size:12px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:2px solid transparent;color:#dbe3f3;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.active{background:var(--yellow);color:var(--navy);}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-left:6px;vertical-align:middle}

.wrap{max-width:1240px;margin:0 auto;padding:20px}
h1,h2,h3{color:var(--navy);line-height:1.2;margin:0 0 .4em}
h1{font-size:30px}
h2{font-size:24px}
h3{font-size:18px}
.lead{color:var(--muted);font-size:17px;max-width:70ch}

/* ---------- Buttons ---------- */
.btn{border:2px solid var(--navy);background:#fff;color:var(--navy);padding:9px 18px;border-radius:10px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--navy);color:#fff}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.btn.primary:hover{background:#ffd43d;border-color:#ffd43d;color:var(--navy)}
.btn.small{padding:5px 12px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:var(--line);color:var(--muted);background:#fff}
.btn.ghost:hover{background:var(--bg);color:var(--navy);border-color:var(--navy)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.btn.teal:hover{background:#4fdad3;border-color:#4fdad3}

/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;border-radius:18px;padding:34px 34px 30px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(44,204,196,.18)}
.hero:before{content:"";position:absolute;right:90px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,199,9,.16)}
.hero h1{color:#fff;font-size:32px;position:relative;z-index:1}
.hero p{color:#dbe3f3;max-width:62ch;margin:6px 0 18px;position:relative;z-index:1;font-size:17px}
.namebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.namebox label{font-weight:600;color:var(--yellow)}
.namebox input{border:2px solid transparent;border-radius:10px;padding:9px 14px;min-width:240px;background:#fff;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:24px}
.pcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:.15s}
.pcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.pcard .mono{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--navy);color:var(--yellow)}
.pcard.ct .mono{background:var(--teal);color:var(--navy)}
.pcard h2{margin:0}
.pcard .by{color:var(--muted);font-size:14px;margin-top:-4px}
.pcard ul{margin:0;padding-left:20px;color:#2a3447}
.pcard .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--navy);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.chip.y{background:var(--yellow-bg);border-color:#f0d56b}
.chip.t{background:var(--teal-bg);border-color:#9fe6e2}
.pcard .go{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.how div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.how b{color:var(--navy);display:block;margin-bottom:2px}
.how span{color:var(--muted);font-size:15px}
.resume{background:var(--yellow-bg);border:2px solid var(--yellow);border-radius:12px;padding:12px 16px;margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* ---------- Call view ---------- */
.callbar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.callbar .pname{font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.callbar .pname .chip{font-size:12px}
.cb-field{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.cb-field input{border:2px solid var(--line);border-radius:8px;padding:6px 10px;width:170px;color:var(--ink)}
.cb-field input:focus{border-color:var(--teal);outline:none}
.progress{flex:1;min-width:180px}
.progress .lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:999px;transition:width .25s}
.layout{display:grid;grid-template-columns:268px 1fr;gap:20px;margin-top:18px;align-items:start}
.nav{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:sticky;top:84px;box-shadow:var(--shadow)}
.nav h4{margin:6px 8px 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.nav button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:14.5px}
.nav button:hover{background:var(--bg)}
.nav button.cur{background:var(--navy);color:#fff}
.nav .num{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--line);color:var(--navy)}
.nav button.cur .num{background:var(--yellow);color:var(--navy)}
.nav button.done .num{background:var(--teal);color:var(--navy)}
.nav button.flag .num{background:var(--red);color:#fff}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--yellow-bg);color:#7a5a00;border-radius:999px;padding:1px 8px;border:1px solid #f0d56b}
.nav button.cur .cnt{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
.nav button.done .cnt{display:none}

.main{min-width:0}
.sec-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sec-head .kick{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sec-head h2{margin:2px 0 0;font-size:28px}
.objbtn{background:var(--red-bg);border:2px solid #f2b8b5;color:var(--red);font-weight:700;border-radius:10px;padding:8px 14px}
.objbtn:hover{background:var(--red);border-color:var(--red);color:#fff}

.say{background:#fff;border:1px solid var(--line);border-left:7px solid var(--teal);border-radius:var(--radius);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.say-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted);font-weight:600}
.pill{background:var(--navy);color:#fff;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:1.2px}
.pill.ver{background:var(--yellow);color:var(--navy)}
.say p{margin:0;font-size:18.5px;line-height:1.7}
.say.ver{border-left-color:var(--yellow)}
.say ul{margin:8px 0 0;padding-left:22px;font-size:17.5px}
.say ul li{margin:3px 0}
.fill{border:0;border-bottom:2px dashed var(--navy);background:var(--yellow-bg);border-radius:4px 4px 0 0;padding:1px 6px;min-width:6ch;font:inherit;font-weight:700;color:var(--navy);text-align:center}
.fill:focus{outline:none;background:#fff0a8;border-bottom-style:solid}
.fill:not(:placeholder-shown){background:var(--teal-bg);border-bottom-color:var(--teal)}
.comp{background:var(--teal-bg);border-bottom:2px solid var(--teal);padding:0 6px;border-radius:4px 4px 0 0;font-weight:800;color:var(--navy)}
.comp.empty{background:var(--yellow-bg);border-bottom:2px dashed var(--navy);font-weight:600;color:var(--muted)}

.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.yn{display:flex;gap:8px;align-items:center}
.yn .q{font-size:14px;color:var(--muted);font-weight:600;margin-right:2px}
.yn button{border:2px solid var(--line);background:#fff;font-weight:800;border-radius:9px;padding:6px 20px;color:var(--navy)}
.yn button:hover{border-color:var(--navy)}
.yn button[data-b="y"].on{background:var(--green);border-color:var(--green);color:#fff}
.yn button[data-b="n"].on{background:var(--red);border-color:var(--red);color:#fff}
.tick{display:inline-flex;align-items:center;gap:9px;font-weight:600;color:var(--navy);cursor:pointer;font-size:15px}
.tick input{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
.req{font-size:12px;color:#7a5a00;background:var(--yellow-bg);border:1px solid #f0d56b;border-radius:999px;padding:1px 9px;font-weight:700}
.req.opt{color:var(--muted);background:var(--bg);border-color:var(--line)}
.msg{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15.5px}
.msg.no{background:var(--red-bg);border:2px solid #f2b8b5;color:#7c1a15}
.msg.yes{background:var(--green-bg);border:1px solid #a8dcc4;color:#0e5a3d}

.note{border-radius:10px;padding:11px 15px;margin:12px 0;font-size:15.5px;border:1px solid;display:flex;gap:10px}
.note b.tag{flex:0 0 auto;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:6px;height:fit-content;margin-top:2px}
.note.agent{background:var(--yellow-bg);border-color:#f0d56b}
.note.agent b.tag{background:var(--yellow);color:var(--navy)}
.note.warn{background:var(--red-bg);border-color:#f2b8b5}
.note.warn b.tag{background:var(--red);color:#fff}
.note.tip{background:var(--teal-bg);border-color:#9fe6e2}
.note.tip b.tag{background:var(--teal);color:var(--navy)}
.step-h{margin:26px 0 -4px;font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.step-h:before{content:"";width:26px;height:4px;background:var(--yellow);border-radius:2px}

.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:16px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl thead th{background:var(--navy);color:#fff;font-size:15px}
.tbl thead th small{display:block;color:var(--yellow);font-weight:700}
.tbl td.v,.tbl th.v{text-align:center;font-weight:700;color:var(--navy)}
.tbl tr.sub td{background:var(--bg);color:var(--muted);font-weight:600;font-size:14px}
.tbl.sel-classic .c-classic, .tbl.sel-gold .c-gold{background:var(--yellow-bg);box-shadow:inset 0 0 0 0 transparent}
.tbl.sel-classic thead .c-classic, .tbl.sel-gold thead .c-gold{background:var(--yellow);color:var(--navy)}
.tbl.sel-classic thead .c-classic small, .tbl.sel-gold thead .c-gold small{color:var(--navy)}
.tblcap{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:20px 0 -6px}

.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:14px 0}
.plan{background:#fff;border:3px solid var(--line);border-radius:16px;padding:20px;text-align:left;box-shadow:var(--shadow);transition:.15s}
.plan:hover{border-color:var(--teal)}
.plan.active{border-color:var(--yellow);background:var(--yellow-bg)}
.plan .pn{font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.plan .pp{font-size:38px;font-weight:800;color:var(--navy);line-height:1.1}
.plan .pp small{font-size:15px;font-weight:600;color:var(--muted)}
.plan ul{padding-left:18px;margin:8px 0 0;color:#2a3447}
.plan .sel{margin-top:10px;display:none;font-weight:800;color:var(--green)}
.plan.active .sel{display:block}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:14px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{border:2px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink);font-size:16px;font-weight:500}
.fld input:focus,.fld select:focus{border-color:var(--teal);outline:none}
.fields .hd{grid-column:1/-1;font-weight:800;color:var(--navy);font-size:15px}

.points .pt{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0;box-shadow:var(--shadow);border-left:7px solid var(--yellow)}
.points .pn{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:800}
.points .pt p{margin:0 0 8px;font-size:17.5px}

.benefit{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;box-shadow:var(--shadow);align-items:flex-start}
.benefit .bn{flex:0 0 36px;height:36px;border-radius:10px;background:var(--teal);color:var(--navy);display:grid;place-items:center;font-weight:800}
.benefit b{color:var(--navy);font-size:17px}

.inl-obj{background:var(--red-bg);border:2px solid #f2b8b5;border-radius:var(--radius);padding:14px 16px;margin:16px 0}
.inl-obj .t{font-weight:800;color:var(--red);font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.inl-obj .q{font-weight:800;color:var(--navy);font-size:18px;margin:2px 0 6px}
.inl-obj p{margin:0 0 10px;font-size:17px}

.footnav{display:flex;justify-content:space-between;gap:12px;margin:26px 0 8px;align-items:center;flex-wrap:wrap}
.pendbar{background:var(--yellow-bg);border:1px solid #f0d56b;border-radius:10px;padding:9px 14px;color:#6b4e00;font-weight:600;font-size:14.5px;flex:1;min-width:200px}
.pendbar.ok{background:var(--green-bg);border-color:#a8dcc4;color:#0e5a3d}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:14px 0}
.sumcol{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.sumcol h4{margin:0 0 6px;color:var(--navy);font-size:15px}
.sumrow{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;padding:4px 0;cursor:pointer;border-radius:6px}
.sumrow:hover{background:var(--bg)}
.sumrow i{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:var(--line);color:var(--muted);margin-top:1px}
.sumrow.ok i{background:var(--green);color:#fff}
.sumrow.bad i{background:var(--red);color:#fff}
.verdict{border-radius:var(--radius);padding:16px 18px;margin:14px 0;font-weight:700;font-size:17px}
.verdict.ok{background:var(--green-bg);border:2px solid #a8dcc4;color:#0e5a3d}
.verdict.pend{background:var(--yellow-bg);border:2px solid #f0d56b;color:#6b4e00}
.verdict.bad{background:var(--red-bg);border:2px solid #f2b8b5;color:#7c1a15}
.notes textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}

/* ---------- Objections ---------- */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;border:2px solid var(--line);border-radius:999px;padding:11px 18px;background:#fff;font-size:16px}
.search input:focus{border-color:var(--teal);outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--navy);font-size:14.5px}
.fchip:hover{border-color:var(--navy)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.method div{background:#fff;border:1px solid var(--line);border-top:5px solid var(--yellow);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.method b{color:var(--navy);display:block}
.method span{color:var(--muted);font-size:14.5px}
.tone{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;box-shadow:var(--shadow)}
.tone summary{padding:13px 16px;font-weight:800;color:var(--navy);cursor:pointer}
.tone ul{margin:0;padding:0 20px 14px 38px;color:#2a3447}
.tone li{margin:5px 0}
details.obj{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
details.obj[open]{border-color:var(--teal)}
details.obj summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:700;color:var(--navy);font-size:17px}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary:before{content:"+";flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}
details.obj[open] summary:before{content:"\2212";background:var(--yellow);color:var(--navy)}
details.obj summary:hover{background:var(--bg)}
details.obj .badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 10px;letter-spacing:.3px}
.badge.ra{background:var(--navy);color:var(--yellow)}
.badge.ct{background:var(--teal);color:var(--navy)}
.obj-body{padding:4px 16px 16px;display:grid;gap:10px}
.ostep{border-radius:10px;padding:10px 14px;background:var(--bg);border-left:5px solid var(--line)}
.ostep b{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.ostep p{margin:0;font-size:16.5px}
.ostep.s1{border-left-color:var(--yellow)}
.ostep.s2{border-left-color:var(--teal);background:var(--teal-bg)}
.ostep.s2 p{font-size:17.5px}
.ostep.s3{border-left-color:var(--navy)}
.ostep .copy{margin-top:8px}
.careful{background:var(--red-bg);border:1px solid #f2b8b5;border-radius:10px;padding:10px 14px;color:#7c1a15;font-size:15.5px}
.empty-state{text-align:center;color:var(--muted);padding:30px}
.backcall{background:var(--yellow-bg);border:2px solid var(--yellow);border-radius:12px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}

/* ---------- Facts ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-top:10px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.fcard h2{display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:10px 0}
.kv dt{font-weight:700;color:var(--navy)}
.kv dd{margin:0}
.fcard ul{padding-left:20px}
.fcard li{margin:5px 0}

/* ---------- Price list / info centre ---------- */
.suite{background:linear-gradient(160deg,#1c3a73,var(--navy-dark));border-radius:18px;padding:22px;color:#fff;box-shadow:var(--shadow)}
.suite-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.suite-top h2{color:#fff;margin:0;font-size:30px}.suite-top h2 em{color:var(--yellow);font-style:normal}
.suite-top .tagp{background:var(--yellow);color:var(--navy);font-weight:800;border-radius:8px;padding:6px 12px;font-size:13px;text-transform:uppercase;text-align:center;line-height:1.2}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pbox{border-radius:14px;padding:16px;color:#fff;border:1px solid rgba(255,255,255,.25)}
.pbox.ns{background:#2a4a8f}.pbox.ctp{background:#17795a}.pbox.mdp{background:#6a2a86}
.pbox h3{color:var(--yellow);letter-spacing:1px;margin:0 0 10px;font-size:18px;text-transform:uppercase}
.pbox .sub{font-weight:700;font-size:16px}
.pbox ul{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}
.pbox li{margin:3px 0}.pbox li:before{content:"\2713 ";color:var(--yellow);font-weight:800}
.opt{background:var(--yellow);color:var(--navy);border-radius:10px;padding:10px 12px;margin:8px 0}
.opt b{display:block;font-size:15px}.opt .pr{font-size:30px;font-weight:800;line-height:1.1}.opt .pr small{font-size:13px;font-weight:600}
.opt span{font-size:13px;font-weight:700}
.why{background:rgba(255,255,255,.14);border-left:4px solid var(--yellow);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:10px}
.pbox .big{font-size:36px;font-weight:800;line-height:1.1}.pbox .big small{font-size:14px;font-weight:600}
.badge-no{display:inline-block;background:#fff;color:#111;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800;margin-top:8px}
.also{background:#fff;color:var(--ink);border-radius:14px;padding:14px 18px;margin-top:16px}
.also h3{font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:0 0 6px}
.also .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px 28px}
.also .r{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0;font-size:15px}
.also .r b{color:var(--navy)}
.suite .foot{background:var(--yellow);color:var(--navy);font-weight:800;border-radius:10px;padding:8px 14px;margin-top:16px;display:flex;justify-content:space-between;font-size:14px}
.pcard.soon{opacity:.92;border-style:dashed}
.pcard .mono.ns{background:#2a4a8f;color:var(--yellow)}
details.info{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
details.info[open]{border-color:var(--teal)}
details.info summary{list-style:none;padding:13px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:700;color:var(--navy);font-size:17px}
details.info summary::-webkit-details-marker{display:none}
details.info summary:before{content:"+";flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-size:19px;line-height:1}
details.info[open] summary:before{content:"\2212";background:var(--yellow);color:var(--navy)}
details.info summary:hover{background:var(--bg)}
details.info .badges{margin-left:auto;display:flex;gap:6px}
.badge.ns{background:#2a4a8f;color:var(--yellow)}.badge.all{background:var(--line);color:var(--navy)}
.info-body{padding:2px 18px 16px;font-size:16px}
.info-body p{margin:6px 0}
.info-body ul{margin:6px 0;padding-left:22px}.info-body li{margin:3px 0}
.info-body .tbl{box-shadow:none}
.mini{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
.mini td,.mini th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
.mini th{background:var(--bg);color:var(--navy)}
.mini td:last-child{text-align:right;font-weight:700;color:var(--navy);white-space:nowrap}
.flagbox{background:var(--yellow-bg);border:2px solid #f0d56b;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}

/* ---------- Reader (plain script view) ---------- */
.rtop{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.rtitle h1{margin:0}.rtitle .by{color:var(--muted);font-size:14.5px}
.rtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump{position:sticky;top:72px;z-index:20;background:rgba(245,247,250,.96);backdrop-filter:blur(4px);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.jump button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.jump button:hover{background:var(--navy);color:#fff}
.jump button.upsell{background:var(--yellow);border-color:var(--yellow);font-weight:800}
.upcall{background:var(--yellow-bg);border:2px solid var(--yellow);border-radius:12px;padding:14px 18px;margin:22px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px}
.reader{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 36px 36px;box-shadow:var(--shadow)}
.rsec{padding-top:26px;border-top:1px solid var(--line);margin-top:18px}
.rsec:first-child{border-top:0;margin-top:0}
.rsec h2{font-size:24px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rsec h2 span{flex:0 0 34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:16px}
.rline{margin:14px 0}
.rline p{margin:0;font-size:19px;line-height:1.75}
.rline.ver{border-left:5px solid var(--yellow);padding-left:16px;background:var(--yellow-bg);border-radius:0 10px 10px 0;padding-top:8px;padding-bottom:8px}
.vtag{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7a5a00;margin-bottom:2px}
.rline ul{margin:6px 0 0;padding-left:24px;font-size:18px}
.cue{font-size:14.5px;color:var(--muted);font-style:italic;margin-top:4px}
.rnote{background:var(--bg);border-left:4px solid var(--teal);padding:8px 14px;border-radius:0 8px 8px 0;font-size:15px;margin:12px 0;color:#2a3447}
.rnote.warn{border-left-color:var(--red);background:var(--red-bg);color:#7c1a15}
.rnote.agent{border-left-color:var(--yellow)}
h3.rh{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:22px 0 -4px}
.rpoints{padding-left:26px;font-size:18px;line-height:1.7}.rpoints li{margin:10px 0}
.fields.flat{box-shadow:none;border:1px dashed var(--line);background:var(--bg);padding:12px}
.choose.small .plan{padding:12px 16px;text-align:center}.choose.small .pp{font-size:28px}
.reader .tbl{box-shadow:none}
.rend{margin-top:30px;text-align:center}
@media (max-width:700px){.reader{padding:6px 16px 24px}.rline p{font-size:17.5px}.jump{top:64px}}

/* ---------- Notepad ---------- */
.npbtn{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--yellow);color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:11px 20px;font-weight:800;box-shadow:0 4px 16px rgba(16,34,74,.3);display:flex;align-items:center;gap:8px}
.npbtn:hover{background:#ffd43d}
.npbtn.has:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);border:2px solid var(--navy)}
.np{position:fixed;right:18px;bottom:76px;z-index:61;width:min(380px,calc(100vw - 36px));background:#fff;border:2px solid var(--navy);border-radius:16px;box-shadow:0 10px 36px rgba(16,34,74,.35);display:flex;flex-direction:column;overflow:hidden}
.np-h{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.np-h b{font-size:15px}.np-h b small{color:var(--yellow);font-weight:600;margin-left:6px}
.np-h button{background:transparent;border:0;color:#fff;font-size:22px;line-height:1;padding:0 4px}
.np textarea{border:0;resize:vertical;min-height:240px;max-height:60vh;padding:12px 14px;font-size:16px;line-height:1.5;font-family:inherit;color:var(--ink);background:#fffdf0;background-image:repeating-linear-gradient(transparent,transparent 23px,#f0e6b4 24px)}
.np textarea:focus{outline:none}
.np-f{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.np-f span{font-size:12px;color:var(--muted);margin-left:auto}
@media print{.npbtn,.np{display:none}}
.footer{max-width:1240px;margin:20px auto 40px;padding:0 20px;color:var(--muted);font-size:13.5px;text-align:center}
.footer b{color:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:100;border:2px solid var(--yellow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .nav{position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}
  .nav h4{display:none}
  .nav button{width:auto;white-space:nowrap;flex:0 0 auto}
  .tabs{margin-left:0;width:100%}
  .brand-title{display:none}
  .say p{font-size:17px}
  .kv{grid-template-columns:1fr}
  .cb-field input{width:130px}
}
@media print{.topbar,.nav,.footnav,.callbar{display:none}}
</style>

      ["ct_f4","24 hours' notice / R600 call-out","I agree that cancelling a fitment requires 24 hours' notice, or I will be liable for a R600 callout fee."],
      ["ct_f5","Terms and Conditions on website","I acknowledge that Cartrack's full Terms and Conditions are on their website and will be shared after this agreement."],
      ["ct_f6","Installation proof shared with insurer","I allow Cartrack to share installation proof with my insurer or any relevant party."],
      ["ct_f7","Verbal agreement accepted","I hereby accept this verbal agreement and confirm the Cartrack Terms and Conditions will be contractually binding on me."]

    S("So, [[client|client's name]], that's where Netstar comes in. Their vehicle tracker gives you 24/7 tracking and recovery, so you can locate your car in real time from your phone or computer. Even if the worst happens, we can dispatch our recovery teams to track and recover your vehicle."),
    S("Not only does this give you peace of mind, but it can also lower your insurance premiums as many insurers offer discounts for having a tracking device installed. Plus, if your car is ever involved in an accident or is stolen, we can assist with minimising the stress and hassle you are already going through.")
  ]},
  { title:"The Product & Price", blocks:[
    H("NETSTAR EARLY WARNING"),
    S("Their **Early Warning** is the top of the range product."),
    S("You will receive a **tag** with this unit which must be kept with your keys as it will arm and disarm the unit automatically. If the tag is not present, the unit will send out a “Theft” signal."),
    S("There is also a **panic button** for hijacking situations."),
    S("**Jamming Resist** technology notifies Netstar if the unit signals are tampered with, this includes Car Park Jamming Alerts if the unit detects remote locking jamming. You are thus reminded to ensure that your vehicle is locked."),
    S("The unit also transmits driving behaviour data such as location, speed, harsh acceleration, and harsh braking."),

  ]},
  { title:"Benefits", blocks:[
    S("**Vehicle Recovery:** If your car is stolen, Netstar can help track and recover it to get it back as quick as possible."),
    S("**Peace of Mind:** You'll always know where your vehicle is, whether you're at home or away."),
    S("**Insurance Savings:** Many insurance companies offer discounts for vehicles with a tracking device installed, so you could save on premiums."),
    S("**24/7 Monitoring:** Netstar provides round-the-clock tracking, giving you constant protection no matter the time of day."),
    S("**Emergency Assistance:** In case of an accident or emergency, Netstar can help by locating your car, which can be crucial for getting help fast."),

    S("**Convenient Access:** You can track your vehicle from your phone or computer anytime, anywhere."),

  ]},
  { title:"Close", blocks:[

    S("Wonderful! [[client|client's name]], let's go ahead and finalise your details. Now, before we continue…")
  ]},
  { title:"Premium & Banking", blocks:[
    H("PREMIUM"),
    S("Superb, so we are about rounding up now. I just want to tell you about the costs involved."),
    S("You have opted for the **{{nsname}}** for your [[vehicle|vehicle make]]. This is at a standard cost of **{{nsprice}}**. You did say you want cover to start [[startdate|date from the Close question]]. Please confirm that this is correct?",{ver:1,yn:"ns_prem",label:"Premium confirmed (clear YES)",no:"By selecting No to this question, this quotation cannot be completed. Objection handle, and ask again."}),
    H("BANKING"),
    S("Wonderful, now to seal the deal, let's take down your banking details. Who do you bank with… Capitec, FNB…?"),
    S("Super, and this is a cheque or savings account?"),
    S("Great! And this [[bank|bank name]] account is in your name?"),
    S("For convenience, debit order runs are normally on your salary date. Please confirm the date?"),
    H("BANKING CLAUSES (READ ONCE BANKING DETAILS HAVE BEEN RECEIVED)"),
    S("Are these your own banking details? If not, we require written authority from the account holder to debit the account.",{ver:1,yn:"ns_own",label:"Own banking details",no:"We require written authority from the account holder to debit the account."}),
    S("Do you authorise **Netstar** to debit your account monthly from the banking details supplied?",{ver:1,yn:"ns_auth",label:"Debit authorisation (YES)"}),
    S("Your first debit order will be higher as it will include your monthly premium for [[firstmonth|month]] and a pro rata amount for the remainder of this month. (Advise client if applicable.)",{ver:1}),
    S("You will receive an email which will include your first invoice together with an invoice for the pro-rata amount which is calculated from the date of installation. (Advise client if applicable.)",{ver:1}),

  ]},
  { title:"Rental Terms & Sale Confirmation", blocks:[

    S("The rental option is a **36-month contract**.",{ver:1}),
    S("If you wish to cancel your contract for any reason, you may do so upon **20 (twenty) working days written notice** to us and by payment of a **reasonable settlement fee**.",{ver:1}),
    S("Netstar will make every reasonable effort to recover your vehicle, however **recovery is not guaranteed**.",{ver:1}),
    S("Please download the MyNetstar app to view the functionality of your unit or call us every 6 months to test.",{ver:1}),
    S("If you do need any additional information, you can call Netstar's Customer Support Centre on **0860 12 24 36** or directly from your APP.",{ver:1}),
    S("Full terms and conditions are available on the Netstar website, and they will also mail you a link, please read and let us know of any queries prior to fitment.",{ver:1}),
    S("Please note that by having the unit installed, you agree to all the Terms and Conditions. **This call forms the basis of your contract with Netstar.**",{ver:1}),
    S("Please take note the responsibility to cancel your existing contract lies with you and this cannot be done by Netstar.",{ver:1}),
    H("SALE CONFIRMATION"),
    S("[[client|client's name]], thank you for taking the time to talk to me. Please confirm you have agreed to have the **{{nsname}}** installed in your [[vehicle|vehicle make and model]] for **{{nsprice}}** a month?",{ver:1,yn:"ns_sale",label:"Sale confirmation (clear YES)",no:"By selecting No to this question, this quotation cannot be completed. Objection handle and ask again."}),
  ]},
  { title:"Booking & Fitment", blocks:[
    S("You mentioned you would like installation done at [[fitplace|work or home, from the Close question]]. Netstar can install **Monday to Friday from 8am to 5pm**. Please will you give me the street address for [[fitplace|work or home]]?"),
    H("BOOKING TOOL"),
    S("“Netstar can fit the device on [[slot1|e.g. Thursday at 08:00]] or [[slot2|e.g. Friday at 10:00]]. Which do you prefer?”"),
    H("REQUIREMENTS TO STATE"),
    S("“Netstar need a safe, private area for the fitment. Do you have a secure area?”"),
    S("“The vehicle must be in working condition for activation and testing. Can you confirm this?”"),
    S("“If in a basement, ensure there's enough space to open the door and adequate lighting.”"),
    S("“Fitment will take approximately [[hours|hours]] hours.” (Obtain from the booking tool.)"),
    S("Wonderful, so that has been confirmed for the [[fitdate|date]], at [[fitaddress|address]]. A scheduler will contact you if the need arises."),
    {t:"upcall"}
  ]},
  { title:"Repair Assist Upsell (optional)", blocks:[
    H("INTRODUCE IT"),
    S("[[client|client's name]], before I let you go, may I quickly tell you about one more product that goes well with your tracker? It's called **Repair Assist**, and it helps you pay for mechanical repairs if your car breaks down."),
    H("CREATE THE NEED"),
    S("If your car broke down today, would you have the cash in hand to repair it? Many South Africans struggle to find money for an unexpected mechanical repair, and it often happens at the worst possible time."),
    H("KEY POINTS (SAY IT IN YOUR OWN WORDS)"),
    {t:"list",items:["Helps pay for repairs after an **unforeseen mechanical or electrical breakdown** of the **engine, gearbox, differential and factory-fitted turbo**.","**Gold R149** a month (incl. VAT), with higher benefit limits.","Extras included: towing, hotel or car rental, Uber, Pothole Guru, Battery Guru and more.","**Any age and any mileage** qualifies. It is a **month-to-month** plan, not a fixed contract.","The limits are the **maximum per approved request**, not a cash pool."]},
    {t:"goldplan"},
    H("A FEW SIMPLE THINGS TO MENTION"),
    {t:"list",items:["Keep the service up to date. If the last service was late, just get it done **within 30 days** and send proof and the km reading **within 45 days**.","Service at a manufacturer-approved dealer or an **RMI-registered** workshop.","If something goes wrong, **WhatsApp Repair Assist before any repair starts** so it can be approved.","The plan becomes active **90 days after the first successful debit**, so it is best to join while the car is running well.","It isn't a warranty or insurance, and it doesn't cover faults that were already there, or normal servicing and wear and tear.","Check the vehicle is eligible (taxis, hire, modified vehicles and certain luxury makes are excluded). The list is in the Info Centre."]},
    H("THE OFFER"),
    S("The **Repair Assist Gold** plan is **R149 a month**. Would you like to add it to your Netstar tracker?"),
    H("TERMS AND CONDITIONS"),
    S("Before we set it up, [[client|client's name]], please note that Repair Assist has its own Terms and Conditions, which are separate from your Netstar terms. The key points for Repair Assist are:"),
    {t:"list",items:["It is a **month-to-month** plan, active for as long as the monthly debit is successfully paid. **There are no refunds** on monthly debits.","You can cancel in writing with **31 days' calendar notice**, by email to **helpme@repairassist.co.za**.","The plan becomes active **90 days after your first successful debit**.","If a debit is missed or rejected, the plan is suspended for that month. After **2 unsuccessful debits** it is cancelled.","The plan **can't be transferred** to another vehicle or a new owner.","Repair Assist can recover amounts it pre-funded from your later monthly debits, or from you directly if the plan is cancelled.","It is **not a warranty or insurance**. It doesn't cover faults that were already there, normal servicing, wear and tear, and the other exclusions in the plan wording."]},
    S("Do you understand and accept the Repair Assist Terms and Conditions?",{yn:"ns_ra_tc",label:"Repair Assist Terms and Conditions accepted (YES)",no:"A clear YES is needed. Explain again, or thank the client and continue to the Conclusion."}),
    H("DEBIT ORDER (COVER EACH POINT AND GET A CLEAR YES)"),
    {t:"list",items:["Confirm the payer's ID number, full name and cell number.","The client authorises **Motordrive SA** to debit **R149 a month** for the Repair Assist **Gold** plan, and the amount will never exceed what was agreed.","Confirm that the same banking details given for the Netstar debit order will be used.","The debit date, the month of the first payment, and that a weekend or public holiday debit goes on the next business day.","The reference that will show on the bank statement.","If there are insufficient funds, the account may be tracked until the funds are available.","Ask for a final confirmation that the client understands and agrees."]},
    S("[[client|client's name]], we already have your banking details from your Netstar debit order, so please confirm that we are using the same details you provided earlier for the Repair Assist debit order. Is that correct?",{yn:"ns_ra_bank",label:"Same banking details confirmed (YES)",no:"Get the correct account details in the client's name before continuing."}),
    S("Do you authorise **Motordrive SA** to debit your account **R149** a month for your Repair Assist **Gold** plan? Yes or no?",{yn:"ns_ra_auth",label:"Repair Assist debit authorisation (YES)",no:"No clear YES means no Repair Assist sale. Thank the client and continue to the Conclusion."}),
    S("Do you confirm that you understand and agree to this debit order authorisation?",{yn:"ns_ra_final",label:"Repair Assist final confirmation (YES)",no:"A second clear YES is needed. Don't close this sale without it."})

/* =====================================================================
   DATA: objections (South African terms)
   prods: ra = Repair Assist, ct = Cartrack
===================================================================== */
const OBJ = [
/* ---------- both products ---------- */
{id:"ns_premium",prods:["ns"],title:"It's too expensive / I can't afford it",tags:"price premium expensive cost value uncertain afford too much cheaper",
 ack:"I understand that price is always an important consideration, and it's great that you're thinking about the investment.",
 say:"But when you look at the long-term benefits, it's less about the upfront cost and more about the value Netstar can provide. Think of the loss if your car is stolen: how much would that impact your pocket? Not to mention the time and frustration of dealing with insurance? Netstar is designed to give you 24/7 peace of mind. Plus, it could even lower your car insurance premiums, saving you money in the long run.\n\nWith Netstar, you're not just paying for a service, you're buying the security of your vehicle and the protection of your assets. The cost of replacing a stolen vehicle, or the stress of dealing with it, could be much higher than the price of our tracker. And if your car is recovered, the tracker essentially pays for itself.",
 back:"Ask the close question after addressing the objection.",
 avoid:"Use only when there is uncertainty about the price. Don't promise a premium discount: say insurers may offer one."},
{id:"ns_tag",prods:["ns"],title:"Why must I keep the tag with my keys?",tags:"tag keys arm disarm theft signal early warning",
 ack:"Good question, it's what makes Early Warning work.",
 say:"With **Early Warning** you get a tag that must be kept with your keys. It **arms and disarms the unit automatically**. If the tag isn't present, the unit sends out a **\"Theft\" signal**. Just keep it on your key ring.",
 back:"Go back to the Early Warning description, then the price.",
 avoid:"Don't promise the vehicle will be recovered. Recovery is not guaranteed."},
{id:"ns_recovery",prods:["ns"],title:"Will you definitely recover my car if it's stolen?",tags:"recovery guaranteed stolen hijack theft",
 ack:"With crime the way it is, I understand why you want to be sure.",
 say:"I'll be honest with you: Netstar will make every reasonable effort to recover your vehicle, but **recovery is not guaranteed**. What the unit does is give early warning and the information to act fast.",
 back:"Return to the product and the benefits.",
 avoid:"Never guarantee recovery."},
{id:"ns_36",prods:["ns"],title:"36 months is too long / what if I cancel?",tags:"36 months contract cancel settlement fee notice 20 working days",
 ack:"That's a fair concern, and I'd rather you hear it now.",
 say:"The rental option is a **36 month contract**. If you wish to cancel for any reason, you can do so on **20 working days written notice** and by paying a **reasonable settlement fee**. The full terms are on the Netstar website and they'll mail you a link before the fitment.",
 back:"Move on to the banking details if they're comfortable.",
 avoid:"Don't quote a settlement amount: it isn't in the script. Say the full terms are on the Netstar website, or ask your team leader."},
{id:"ns_why259",prods:["ns"],title:"Why should I pay R259 and not R239?",tags:"startag r259 r239 difference backup jam removed",
 ack:"Good question, let me explain the difference.",
 say:"Both options have the full Early Warning protection. The extra R20 a month adds the **StarTag back-up device**, a second wireless tracker for added safety. Its battery lasts a maximum of three years and the unit must be replaced after 3 years.",
 back:"Ask which option suits them.",
 avoid:"Don't say the StarTag battery lasts longer than three years."},
{id:"ns_insurer",prods:["ns"],title:"Will it lower my insurance? Does my insurer need it?",tags:"insurance insurer discount premium policy compliance",
 ack:"That's a good thing to check.",
 say:"Many insurers offer discounts for having a tracking device installed, so it could lower your premiums. I'd suggest you confirm with your insurer exactly what they offer. Netstar will also give you a fitment certificate that you can see on my.netstar.co.za or the MyNetstar app.",
 back:"Return to the benefits and the close question.",
 avoid:"Don't promise a discount or tell the client what their policy says."},
{id:"g_notint",prods:["ra","ct","ns"],title:"I'm not interested",tags:"no not interested hang up",
 ack:"No problem at all, Sir/Ma'am, I appreciate you being straight with me.",
 say:"Can I ask, is it that you've already got this sorted, or is it just that the timing is off? Most people tell me that until they hear what it works out to per day. Give me 30 seconds, and if it's still not for you, I'll leave you in peace.",
 back:"One polite attempt only. If they agree, return to the Create Need question (Repair Assist) or the vehicle question (Cartrack).",
 avoid:"Don't argue or repeat the whole pitch. If the second \"no\" is clear, thank them and end the call. Record the outcome."},
{id:"g_busy",prods:["ra","ct","ns"],title:"I'm busy right now / call me later",tags:"busy later callback driving work",
 ack:"Eish, I hear you, and I'm sorry for catching you at a bad time.",
 say:"When is a better time, today or tomorrow? I'll call you then, it only takes a few minutes. What time suits you, and is this the best number to reach you on?",
 back:"Capture the exact day and time on the system, confirm it back to the client, and end warmly.",
 avoid:"Don't say \"I'll call you just now\". In South Africa that can mean five minutes or next week. Always give a real time. Never carry on if the client is driving."},
{id:"g_number",prods:["ra","ct","ns"],title:"How did you get my number?",tags:"popia privacy number data where",
 ack:"That's a fair question and you have every right to ask it.",
 say:"I'm calling from Innovate on behalf of Repair Assist (or Motordrive SA on behalf of Cartrack). I'd rather not guess where your details came from. What I can do is note your preference right now, and if you'd like to know more about the source, I'll pass the question to my team leader so someone can follow up with you properly.",
 back:"If the client is comfortable, carry on. If they don't want calls, record a do-not-contact request and end politely.",
 avoid:"Never make up a source for the number. Be honest or escalate to your team leader."},
{id:"g_scam",prods:["ra","ct","ns"],title:"Is this a scam?",tags:"scam fraud trust legit real company",
 ack:"I'm glad you asked. With so many scams going around in South Africa, you must be careful.",
 say:"This call is recorded, and I'll tell you exactly who we are and what you'd be signing up for before anything is agreed. I will never ask for your card PIN or your online banking password. You don't have to agree to anything on this call, and you can ask me to slow down or repeat anything. For Cartrack: Motordrive SA is a registered financial services provider, and a copy of the call is available on request.",
 back:"Offer to repeat the company details, then go back to where you were in the script.",
 avoid:"Don't pressure anyone who feels unsafe. If they want to check you out first, let them."},
{id:"g_think",prods:["ra","ct","ns"],title:"Let me think about it",tags:"think later decide not sure",
 ack:"Absolutely, it's a decision worth thinking about.",
 say:"So I can help you properly, what is the one thing you'd still want to think over? Is it the price, how it works, or something I haven't explained well enough? Let me answer that now so you don't have to chase me for the answer later.",
 back:"Isolate the real concern, handle it, then ask the closing question again (Classic or Gold for Repair Assist, vehicle details for Cartrack). If they still need time, agree a specific callback day and time.",
 avoid:"Don't accept an open-ended \"I'll call you back\". Agree a date and time that you will call them."},
{id:"g_partner",prods:["ra","ct","ns"],title:"I need to speak to my wife / husband / partner first",tags:"wife husband spouse partner permission authority decide",
 ack:"Ja, that makes sense. It's a decision for the household.",
 say:"Is your wife/husband available now? I'm happy to explain it again to both of you, it only takes a few minutes. If not, when are you both home so I can call back and do it properly?",
 back:"Either speak to both of them now, or book a callback with a day and time. The person who owns the bank account must be the one who authorises the debit on the recorded call.",
 avoid:"Don't sign anyone up who says they don't have the authority. The Cartrack authority confirmation must be a clear YES, otherwise end the call."},
{id:"g_email",prods:["ra","ct","ns"],title:"Just send me an email / WhatsApp the details",tags:"email whatsapp send info details brochure",
 ack:"Sure, happy to help with that.",
 say:"I'm happy to share more. The one thing is that the debit order authorisation has to be recorded on this call, it can't be done by email. So let me answer any questions you have right now, and if you're comfortable, we can take it from there.",
 back:"Answer their questions, then return to the choice or the next step in the script.",
 avoid:"Don't say you'll \"send a quote\" and drop the lead. If they really want it in writing, agree a callback time before you hang up."},
{id:"g_bank",prods:["ra","ct","ns"],title:"I don't give my banking details over the phone",tags:"bank details debit order safe fraud account otp",
 ack:"That's very sensible. I'd say the same, there's so much fraud out there.",
 say:"This line is recorded for your protection and mine, and the debit authorisation is read to you word for word so nothing is hidden. You're free to stop at any point. With Cartrack, your bank also sends a DebiCheck request to your phone, so nothing is taken unless you approve it in your banking app.",
 back:"If they are comfortable, continue with the banking details step. If not, offer a callback so they can have the details to hand.",
 avoid:"Never ask for a card PIN, an online banking password or an OTP. Only the details the script asks for."},

/* ---------- Repair Assist ---------- */
{id:"ra_warranty",prods:["ra"],title:"But I already have a warranty",tags:"warranty already have covered plan",
 ack:"That's good, Sir/Ma'am, it shows you're already thinking ahead.",
 say:"Repair Assist can **complement** an existing warranty. If there is a shortfall on an underlying warranty claim, you may submit a Repair Assist Benefit Access Request for a component covered by Repair Assist, subject to the applicable benefit limit and the plan terms and conditions.",
 back:"Return to the plan options: \"Let me show you what the two options cover, and you can see how it fits with what you already have.\"",
 avoid:"Don't say it replaces or doubles their warranty. It only complements it, within the benefit limits and plan terms."},
{id:"ra_price",prods:["ra"],title:"It's too expensive / I can't afford it",tags:"expensive price cost afford money budget tight cheap",
 ack:"I hear you, boss. Everything has gone up, fuel, groceries, rates, so I won't pretend money isn't tight.",
 say:"That's exactly why Classic is only **R99 a month**, which is about **R3.30 a day**. One unexpected engine or gearbox repair can run into thousands, and Classic can contribute **up to R5 000 towards the engine** and **R4 000 towards the gearbox** per approved request, subject to the plan terms. And if R99 is still a stretch, there's no shame in that. Shall we start with Classic?",
 back:"Go back to the choice: \"Classic at R99, or Gold at R149?\" Only two prices exist, so don't invent a third.",
 avoid:"Don't offer discounts or a custom price. Don't say the limits are a cash pool: they are maximums per approved request."},
{id:"ra_reliable",prods:["ra"],title:"My car is reliable / I never have breakdowns",tags:"reliable never breakdown good car new",
 ack:"That's great, and I hope it stays that way for you.",
 say:"The thing about breakdowns is they never send a warning. It's usually on a Friday afternoon, or when you're far from home. It works like insurance: you hope you never use it, but if a big component fails, you're not left with the whole bill. For R99 a month you have that peace of mind.",
 back:"Return to Create Need: \"If it did happen tomorrow, would you have the cash in hand to fix it?\"",
 avoid:"Don't scare the client or suggest their car will definitely fail. Keep it friendly and honest."},
{id:"ra_mechanic",prods:["ra"],title:"My mechanic is cheap / I'll fix it myself",tags:"mechanic garage cheap diy fix myself workshop",
 ack:"A good mechanic is gold, Sir/Ma'am, keep him.",
 say:"Even with a good price from your mechanic, a major repair on an engine or gearbox runs into thousands. Repair Assist is there to take the sting out of that, within the plan limits. One thing to know: services must be done at a **manufacturer approved dealer or an RMI-registered workshop**. Is your mechanic RMI-registered? If not, we'd need to get administrator approval first.",
 back:"Return to the plan options and the benefit limits table.",
 avoid:"Don't say the workshop doesn't matter. Services by a relative or friend are generally NOT acceptable: a formal technical qualification must be supplied and approved, and oil and parts receipts kept. A non-RMI workshop needs approval first, and authorisation is needed before any repair starts."},
{id:"ra_insured",prods:["ra"],title:"I've got insurance, I'm covered",tags:"insurance insured covered comprehensive short term",
 ack:"Good, it's important to have insurance in South Africa.",
 say:"Most motor insurance is there for accidents, theft and damage. Mechanical breakdown is a different risk, so it's worth checking your policy for that. Repair Assist is aimed at qualifying mechanical and electrical failures of the big components. It also includes benefits like an **insurance excess payment** (R500 Classic, R1 000 Gold), subject to the plan terms.",
 back:"Return to the Solution step and walk through the additional benefits table.",
 avoid:"Don't tell the client what their own policy covers. Suggest they check it."},
{id:"ra_wait",prods:["ra"],title:"Why must I wait 90 days? / What's the waiting period?",tags:"waiting period 90 days wait active start",
 ack:"Good question, I want you to know this before you decide.",
 say:"The plan becomes active for Benefit Access **90 days after your first successful debit order**, unless the manufacturer-warranty provision in the plan wording applies. Repairs that arise before then are for your own account. That's why it's best to join while the car is running well, not after something goes wrong.",
 back:"Make sure you also read Important Point 4 (waiting period) when you get to that step.",
 avoid:"Don't promise the waiting period will be waived. Only say the manufacturer-warranty provision may apply under the plan wording."},
{id:"ra_service",prods:["ra"],title:"My service is not up to date / I missed a service",tags:"service records overdue missed logbook proof 30 days 45 days",
 ack:"No stress, it happens to many of us, and it's good that you're telling me.",

{id:"ra_cancel",prods:["ra"],title:"Is it a contract? Can I cancel?",tags:"contract cancel month to month lock in notice",
 ack:"Fair question, nobody likes being locked in.",

{id:"ra_limit",prods:["ra"],title:"What if the repair costs more than the limit?",tags:"limit cap maximum more expensive shortfall cash pool",

{id:"ra_covered",prods:["ra"],title:"What exactly is covered?",tags:"covered what covers exclusions components engine gearbox turbo",

{id:"ra_claim",prods:["ra"],title:"How does a claim work? / Do I just go to my garage?",tags:"claim process authorisation approval repair garage 2000 km",

{id:"ra_choose",prods:["ra"],title:"I can't decide between Classic and Gold",tags:"classic gold choose which better decide difference",
 ack:"Fair enough, both are good options, so let me help you.",

{id:"ra_burnt",prods:["ra"],title:"I've been burnt by plans like this before",tags:"burnt scam before bad experience trust claim rejected",

{id:"ra_eligible",prods:["ra"],title:"Is my car eligible? (make, taxi, modified, bakkie)",tags:"eligible vehicle taxi uber modified bakkie suv bmw audi land rover porsche excluded not covered gvm",

const TONE = [
 "**Listen, Acknowledge, Answer, Ask.** Let the client finish, show you heard them, give a short honest answer, then ask a question that moves the call on.",
 "**Greet properly.** \"Good day\" or \"Good morning\" and Sir/Ma'am or the client's surname. If you speak their home language, a short greeting goes a long way.",
 "**Light local touches work in the sales conversation if natural:** \"Ja, I hear you\", \"Eish, that's tough\", \"No problem at all\". Don't overdo slang or you'll sound scripted.",
 "**No slang on the verification / debit declaration.** Read it in clear English, use the client's name more than three times, let them ask questions without interrupting, and repeat a clause if you were interrupted so you get a clear Yes. You can explain it again in the client's preferred language afterwards.",
 "**Use everyday South African realities:** the price of fuel, groceries, load shedding, potholes, the rand. They land better than jargon.",
 "**Never say \"just now\" or \"now now\" for a callback.** Give a real day and time.",
 "**Speak slowly on recorded sections.** Every YES must be clear and audible. Never ask for PINs, passwords or OTPs.",
 "**If you don't know, say \"let me check\".** A wrong promise costs more than a short delay. Respect a clear \"no\" and record it."
];

/* =====================================================================
   STATE
===================================================================== */
const state = { tab:"scripts", product:null, sec:0, fills:{}, yn:{}, ticks:{}, plan:null, filter:"all", query:"", openObj:null, fromCall:false, infoTab:"price", infoQ:"", nsplan:"ewst" };
try{ const a=localStorage.getItem("innovate_agent"); if(a) state.fills.agent=a; }catch(e){}

const $app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>"); }
function fmt(s){
  s = esc(s);
  s = s.replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(m,k,p)=>`<input class="fill" data-fill="${k}" placeholder="${p}" aria-label="${p}" autocomplete="off" spellcheck="false">`);
  s = s.replace(/\{\{(\w+)\}\}/g,(m,k)=>`<span class="comp" data-comp="${k}"></span>`);
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
  return s;
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }

/* required items, per product */
function reqsFor(pid){
  const out=[]; const sc=SCRIPTS[pid];
  sc.sections.forEach((sec,si)=>sec.blocks.forEach(b=>{
    if(b.t==="say"){
      if(b.yn && b.req!==false) out.push({k:b.yn,type:"yn",label:b.label||b.yn,sec:si});
      if(b.read) out.push({k:b.read,type:"tick",label:b.label||b.read,sec:si});
    }
    if(b.t==="points") b.items.forEach(p=>out.push({k:p.k,type:"tick",label:p.l,sec:si}));
    if(b.t==="choose") out.push({k:"plan",type:"plan",label:"Plan chosen (Classic or Gold)",sec:si});
  }));
  return out;
}
const REQS = { ra:reqsFor("ra"), ct:reqsFor("ct") };
function isDone(r){ return r.type==="yn" ? state.yn[r.k]==="y" : r.type==="tick" ? !!state.ticks[r.k] : !!state.plan; }
function isBad(r){ return r.type==="yn" && state.yn[r.k]==="n"; }

/* =====================================================================
   RENDER: shell
===================================================================== */
function setTab(t){
  state.tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  render(); window.scrollTo({top:0});
}
function render(){
  document.getElementById("liveDot").hidden = !state.product;
  if(state.tab==="scripts") (state.product? renderCall() : renderHome());
  else if(state.tab==="objections") renderObjections();
  else renderFacts();
}

/* =====================================================================
   HOME
===================================================================== */
function renderHome(){
  const card = s => `
  <article class="pcard ${s.id} ${s.soon?"soon":""}">
    <div class="mono ${s.id}">${s.short}</div>
    <div><h2>${s.label}</h2><div class="by">${esc(s.by)}</div></div>
    <p style="margin:0">${esc(s.blurb)}</p>
    <ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
    <div class="meta">${s.soon?"":`<span class="chip y">${s.sections.length} steps</span>`}${s.version?`<span class="chip t">${esc(s.version)}</span>`:""}</div>
    <div class="go">${s.soon? `<button class="btn" data-infogo="ns">See Netstar prices</button>` : `<button class="btn primary" data-start="${s.id}">Start script</button>`}</div>
  </article>`;
  $app.innerHTML = `
  <section class="hero">
    <h1>Which script are you using today?</h1>
    <p>Pick your product and read it top to bottom. If the client pushes back, Objection Help is one click away.</p>
    <div class="namebox"><label for="agentName">Your name</label><input id="agentName" data-fill="agent" placeholder="Type your name" autocomplete="off"></div>
  </section>
  ${state.product? `<div class="resume"><div><b>Call in progress:</b> ${SCRIPTS[state.product].name}</div><div><button class="btn primary small" data-tab-go="scripts">Resume call</button></div></div>`:""}
  <div class="cards">${card(SCRIPTS.ra)}${card(SCRIPTS.ct)}${card(SCRIPTS.ns)}</div>
  <div class="resume" style="background:#fff;border-color:var(--line)"><div><b>November agent price list</b> &middot; Netstar from R239, Cartrack Quick Gold + Tag R239, Repair Assist Gold R149</div><div><button class="btn small" data-infogo="price">Open price list</button></div></div>
  <div class="how">
    <div><b>1. Read it</b><span>The whole script is on one page. Scroll down, or use the step buttons at the top to jump.</span></div>
    <div><b>2. Fill the blanks</b><span>Type the client's name once in a yellow blank and it fills in everywhere.</span></div>
    <div><b>3. Handle it</b><span>Press Objection Help for answers you can say word for word.</span></div>
  </div>`;
  syncInputs();
}

/* =====================================================================
   CALL VIEW
===================================================================== */
function renderCall(){
  const sc = SCRIPTS[state.product];
  $app.innerHTML = `
  <div class="rtop">
    <div class="rtitle"><h1>${sc.label}</h1><div class="by">${esc(sc.by)}</div>
      <div class="filters" style="margin-top:8px">${["ra","ct","ns"].map(id=>`<button class="fchip ${state.product===id?"on":""}" data-switch="${id}">${SCRIPTS[id].label}</button>`).join("")}</div></div>
    <div class="rtools">
      <label class="cb-field">Your name <input data-fill="agent" placeholder="Your name" autocomplete="off"></label>
      <button class="btn small ghost" data-act="home">Change script</button>
    </div>
  </div>
  <div class="jump" id="jump">${sc.sections.map((s,i)=>`<button data-sec="${i}" class="${/Upsell/.test(s.title)?"upsell":""}">${i+1}. ${esc(s.title)}</button>`).join("")}</div>
  <article class="reader">
    ${sc.sections.map((sec,i)=>`<section class="rsec" id="sec-${i}"><h2><span>${i+1}</span>${esc(sec.title)}</h2>${sec.blocks.map(renderBlock).join("")}</section>`).join("")}
  </article>`;
  syncInputs(); paintAll();
}
function renderSection(){ renderCall(); }

function renderBlock(b){
  switch(b.t){
  case "say": {
    let cue="";
    if(b.yn && b.req!==false) cue = `<div class="cue">Wait for a clear YES.${b.no?` If NO: ${esc(b.no.replace(/^STOP\.\s*/,""))}`:""}</div>`;
    else if(b.yn && b.no) cue = `<div class="cue">If NO: ${esc(b.no)}</div>`;
    const list = b.list? `<ul>${b.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
    return `<div class="rline ${b.ver?"ver":""}">${b.ver?'<div class="vtag">Read word for word</div>':""}<p>${fmt(b.text)}</p>${list}${cue}</div>`;
  }
  case "note": return b.kind==="tip" ? "" : `<div class="rnote ${b.kind}">${rich(b.text)}</div>`;
  case "h": return `<h3 class="rh">${esc(b.text)}</h3>`;
  case "list": return `<ul>${b.items.map(i=>`<li>${rich(i)}</li>`).join("")}</ul>`;

/* summary */
function summaryHtml(){
  const pid=state.product, rq=REQS[pid], sc=SCRIPTS[pid];
  const bySec = sc.sections.map((s,i)=>({title:s.title,i,items:rq.filter(r=>r.sec===i)})).filter(x=>x.items.length);
  const done=rq.filter(isDone).length, bad=rq.filter(isBad).length, pend=rq.length-done;
  let v;
  if(bad) v=`<div class="verdict bad">${bad} confirmation${bad>1?"s":""} answered No. Do not complete this sale until that is resolved.</div>`;
  else if(pend) v=`<div class="verdict pend">${pend} required confirmation${pend>1?"s are":" is"} still open. Click any item below to jump back to it.</div>`;
  else v=`<div class="verdict ok">All ${rq.length} required confirmations are done. Capture the sale on the system.</div>`;
  const cols = bySec.map(s=>`<div class="sumcol"><h4>${s.i+1}. ${esc(s.title)}</h4>${s.items.map(r=>`<div class="sumrow ${isDone(r)?"ok":isBad(r)?"bad":""}" data-goto="${r.sec}"><i>${isDone(r)?"&#10003;":isBad(r)?"&#10005;":"&bull;"}</i><span>${esc(r.label)}</span></div>`).join("")}</div>`).join("");
  return `<div class="step-h">CALL CHECKLIST</div><div id="summaryLive">${v}<div class="sumgrid">${cols}</div></div>
   <div class="notes"><label for="callNotes"><b>Call notes</b> (for your own use, not saved)</label><textarea id="callNotes" placeholder="Anything to remember for the system..."></textarea></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn teal" data-act="copysum">Copy call summary</button><button class="btn" data-act="newcall">Start a new call</button></div>`;
}
function refreshSummary(){
  const el=document.getElementById("summaryLive"); if(!el) return;
  const tmp=document.createElement("div"); tmp.innerHTML=summaryHtml();
  el.innerHTML=tmp.querySelector("#summaryLive").innerHTML;
}
function summaryText(){
  const pid=state.product, sc=SCRIPTS[pid], rq=REQS[pid], f=state.fills;
  const L=[]; const add=(k,v)=>{ if(v) L.push(`${k}: ${v}`); };
  L.push(`${sc.name} call summary`);
  add("Agent",f.agent); add("Client",f.client);
  if(pid==="ra"){ add("Plan",state.plan?`${PLANS[state.plan].name} R${PLANS[state.plan].price} p.m.`:""); add("Vehicle",[f.make,f.model,f.year].filter(Boolean).join(" ")); add("Registration",f.reg); add("KM",f.km); add("Under manufacturer warranty",f.mwarranty); add("Debit date",f.debitdate); add("First debit month",f.firstmonth); }
  else { add("Product","Quick Gold with Cartrack Tag R239 p.m. incl. VAT, 36 months"); add("Vehicle",f.makemodel); add("Registration",f.reg); add("Debit date",f.debitdate); add("Communication",f.comm); }
  const open=rq.filter(r=>!isDone(r)); const bad=rq.filter(isBad);
  L.push(`Confirmations: ${rq.length-open.length} of ${rq.length} done`);
  if(bad.length) L.push("Answered NO: "+bad.map(r=>r.label).join("; "));
  if(open.length) L.push("Still open: "+open.map(r=>r.label).join("; "));
  const n=document.getElementById("callNotes"); if(n&&n.value.trim()) L.push("Notes: "+n.value.trim());
  L.push("(ID, bank account and password details are deliberately not included.)");
  return L.join("\n");
}

function renderObjections(){
  if(state.filter==="auto"){ state.filter = state.product||"all"; }
  $app.innerHTML = `
  ${state.product && state.fromCall? `<div class="backcall"><div><b>You are on a ${SCRIPTS[state.product].name} call.</b> Handle the objection, then go back to where you were.</div><button class="btn primary small" data-act="backtocall">&larr; Back to call</button></div>`:""}
  <h1>Objection Help</h1>
  <p class="lead">Common pushbacks from South African clients, with a short answer you can say out loud. Tap one to open it.</p>
  <div class="method">
    <div><b>1. Listen</b><span>Let them finish. Don't interrupt.</span></div>
    <div><b>2. Acknowledge</b><span>Show you heard them.</span></div>
    <div><b>3. Answer</b><span>Short, honest and in plain language.</span></div>
    <div><b>4. Ask</b><span>Go back to the close and ask the next question.</span></div>
  </div>
  <div class="tools">
    <div class="search"><input id="objSearch" type="search" placeholder="Type what the client said, e.g. it is too expensive, I need to think, I already have a tracker" value="${esc(state.query)}" aria-label="Type what the client said"></div>
    <div class="filters" id="objFilters"></div>
  </div>
  <details class="tone"><summary>South African tone and rapport tips</summary><ul>${TONE.map(t=>`<li>${rich(t)}</li>`).join("")}</ul></details>
  <div id="objList"></div>
  <div class="note agent"><b class="tag">Agent</b><div>These answers are a guide and use only what is in your approved scripts. Never promise anything that isn't in the plan terms. If you are not sure, say you will check and ask your team leader.</div></div>`;
  paintFilters(); paintObjList();
}
function paintFilters(){
  const f=[["all","All"],["ra","Repair Assist"],["ct","Cartrack"],["ns","Netstar"]];
  document.getElementById("objFilters").innerHTML = f.map(x=>`<button class="fchip ${state.filter===x[0]?"on":""}" data-filter="${x[0]}">${x[1]}</button>`).join("");
}
function paintObjList(){
  const q=state.query.trim().toLowerCase();
  const stop=new Set("a an the i it is its im ive my me we you your to of and or but not no so do dont does did can cant will wont that this are was be been have has had for on in at with as if what they them there then just very too want need get got how why when who from about really".split(" "));
  const stem=w=>w.replace(/(ing|ed|es|s)$/,"");
  const words=q?q.replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!stop.has(w)).map(stem).filter(w=>w.length>1):[];
  const score=o=>{ if(!words.length) return 1; const t=(o.title||"").toLowerCase(), g=(o.tags||"").toLowerCase(), r=((o.say||"")+" "+(o.ack||"")).toLowerCase(); let sc=0; for(const w of words){ if(t.includes(w)) sc+=3; if(g.includes(w)) sc+=2; if(r.includes(w)) sc+=1; } return sc; };
  const list = OBJ.filter(o=>state.filter==="all"||o.prods.includes(state.filter)).map(o=>({o,sc:score(o)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.o).slice(0,q?4:999);
  const el=document.getElementById("objList");
  const nsNote = "";
  if(!list.length){ el.innerHTML=nsNote+`<div class="empty-state">No close match. Acknowledge what they said, ask what worries them most, then go back to the close. If unsure, say you will check and ask your team leader.</div>`; return; }
  el.innerHTML = nsNote + list.map(o=>{
    const badges = o.prods.length>=3 ? `<span class="badge all">All products</span>` : o.prods[0]==="ra"?`<span class="badge ra">Repair Assist</span>`:o.prods[0]==="ns"?`<span class="badge ns">Netstar</span>`:`<span class="badge ct">Cartrack</span>`;
    return `<details class="obj" id="o_${o.id}" ${state.openObj===o.id?"open":""}><summary><span>“${esc(o.title)}”</span><span class="badges">${badges}</span></summary>
    <div class="obj-body">
      <div class="ostep s1"><b>1. Acknowledge</b><p>${rich(o.ack)}</p></div>
      <div class="ostep s2"><b>2. Say this</b><p>${rich(o.say)}</p><button class="btn small" data-copy="${o.id}">Copy answer</button></div>
      <div class="ostep s3"><b>3. Back to the close</b><p>${rich(o.back)}</p></div>
      <div class="careful"><b>Careful:</b> ${rich(o.avoid)}</div>
    </div></details>`;
  }).join("");
  if(state.openObj){ const e=document.getElementById("o_"+state.openObj); if(e){ e.scrollIntoView({block:"center"}); } state.openObj=null; }
}

{p:"ct",c:"Campaign product",t:"Cartrack Tag explained",tags:"tag backup jam gps trailers asset battery",

{p:"ct",c:"Selling points",t:"What sets Cartrack apart",tags:"recovery rate cross border fitment mobile in-house saps",
 text:"• **Cross-border recoveries:** the only tracking company in SA doing recoveries across borders. The vehicle is recovered in the foreign country but not returned across the border.\n• **No upfront cost** for new installations. **Mobile fitment** (a safe, private space is needed) or **in-office fitment** at Cartrack offices in every province (appointment needed).\n• **Recovery rate:** Cartrack describes itself as having the highest recovery rate in South Africa, over 90% (as stated in the training manual).\n• Technicians, recovery teams and tracking units are all in-house.\n• No case number is needed to start a recovery, but one must be logged with SAPS within 24 hours.\n• Core focus is stolen vehicle recovery. Everything else is an add-on.\n• Cartrack does not watch clients on a monitor, and it is not personal security. Be ready for questions about this."},
{p:"ct",c:"Contract rules",t:"Strict sales protocol: contract rules",tags:"36 months escalation pro-rata debicheck cancellation poaching business voice log vin intro broker lead sourcing",
 text:"• **36 month fixed rental term**, nothing shorter. The client is liable for the unit during the 3 years.\n• **Escalation:** Year 1 normal fee, Year 2 +10%, Year 3 a further 10% on the Year 2 rate. (The verbatim script also says increases after that follow CPI: read the script as written.)\n• **Pro-rata and debit orders:** in the fitment month there are two debits: the day after fitment (pro-rata for the rest of the month) and the full next month on the chosen debit date. Each debit pays the **following** month in advance.\n• **DebiCheck is mandatory.** R19 admin fee. Approval via banking app, online banking, USSD, ATM or branch. No fitment without approval. Urgent cases: bank confirmation letter or proof of banking, **no bank statements**.\n• **Banking:** private account linked to the client's ID, allows debits, active this month. No business accounts unless full documentation is completed.\n• **Early cancellation:** private clients R2 650 (a penalty for breaking the term). Business clients: remainder of the contract.\n• **Introduction on every call:** \"I'm calling from [broker name] on behalf of Cartrack.\" **Never pose as Cartrack.**\n• **VIN / chassis number is mandatory.** Confirm it before processing. Licence disc photo by WhatsApp after verification.\n• **Vehicle must be fully operational**, otherwise the sale is on hold.\n• **Business clients:** do NOT voice log. Send and collect the Commercial Subscriber Form, Business Verification Form, CK document, director's ID (front and back for a smart ID) and a bank confirmation letter under 3 months old.\n• **Fitment scheduling:** say \"Cartrack will call you within 3 days.\" Earlier slots may exist but don't overpromise.\n• **Never disclose** unit design or location. **Never use Cartrack's own web or social media** for leads.\n• **Poaching is strictly prohibited.** Never cancel existing Cartrack units or switch clients to another provider.\n• **Existing clients:** no upgrades or downgrades (refer to head office). Add-on vehicles allowed: confirm if the old vehicle is kept, otherwise refer for de-install / re-install.\n• Always be honest and transparent."},
{p:"ct",c:"Contract rules",t:"Fees at a glance",tags:"fees r19 r2650 r870 r350 r600 r25 r30 deinstall change of ownership lifetime maintenance",
 html:()=>rows([["DebiCheck admin fee (once-off)","R19"],["Early cancellation, private client","R2 650 (or the balance, whichever is lesser, per script)"],["De-install / re-install (once-off)","R870"],["Change of ownership (once-off)","R350"],["Repair after 12 month warranty","R600"],["Technician call-out if fault is not Cartrack related","R600"],["Fitment cancelled with less than 24 hours' notice","R600"],["Lifetime maintenance warranty (optional)","R25 per month on the call, R30 after the 11th month"],["Protector (add-on)","R75 per month"]])+`<p style="margin-top:6px">De-install / re-install: the term does not reset. Change of ownership: the contract restarts for the new owner.</p>`},
