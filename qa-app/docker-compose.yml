# Local/office server:  cp .env.example .env  (fill it in)  &&  docker compose up -d --build   -> http://localhost:8000
services:
  qa:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/data"]  # a real folder, so Claude Cowork can be connected to it
    restart: unless-stopped
